<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClawBot — Live Inventory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111;
      --border: #1e1e1e;
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --text: #f0f0f0;
      --muted: #555;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header bar ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo { font-size: 24px; }
    .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .hstat { text-align: right; }
    .hstat .val { font-size: 22px; font-weight: 800; }
    .hstat .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .mongo-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0a1f0a;
      border: 1px solid #166534;
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
    }

    .pulse-dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse-ring 1.5s ease-out infinite;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(74,222,128,0.6); }
      70%  { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }

    /* ── Scroll container ── */
    .scroll-outer {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .scroll-inner {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 28px;
      will-change: transform;
    }

    /* ── Item row ── */
    .item-row {
      display: grid;
      grid-template-columns: 56px 1fr 120px 160px 100px 130px;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      transition: border-color 0.4s, background 0.4s;
    }

    .item-row.low  { border-color: #7c2d12; background: #0f0805; }
    .item-row.out  { border-color: #7f1d1d; background: #0f0505; }
    .item-row.flash {
      animation: flash-update 1s ease-out;
    }

    @keyframes flash-update {
      0%   { background: #052e16; border-color: #166534; }
      100% { background: var(--surface); border-color: var(--border); }
    }

    /* Image */
    .item-img {
      width: 56px; height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #1c1c1c;
      flex-shrink: 0;
    }

    /* Name block */
    .item-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .item-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .item-barcode { font-family: monospace; font-size: 11px; color: #3a3a3a; margin-top: 2px; }

    /* Category badge */
    .cat-badge {
      background: #0c1f3d;
      color: var(--blue);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stock bar */
    .stock-col { display: flex; flex-direction: column; gap: 6px; }
    .stock-nums { display: flex; align-items: baseline; gap: 4px; }
    .stock-qty  { font-size: 22px; font-weight: 800; }
    .stock-of   { font-size: 11px; color: var(--muted); }
    .bar-bg     { height: 5px; background: #1c1c1c; border-radius: 99px; overflow: hidden; }
    .bar-fill   { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status-badge.ok     { background: #052e16; color: var(--green); }
    .status-badge.low    { background: #1c1100; color: var(--yellow); }
    .status-badge.out    { background: #2d0b0b; color: var(--red); }

    /* Price */
    .price-col { text-align: right; }
    .price-val { font-size: 18px; font-weight: 800; color: var(--green); }
    .price-cost { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── Ticker bar ── */
    .ticker {
      height: 36px;
      background: #0a0a0a;
      border-top: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .ticker-track {
      display: flex;
      gap: 48px;
      white-space: nowrap;
      animation: ticker-scroll 30s linear infinite;
      font-size: 12px;
      color: var(--muted);
      padding-left: 100%;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .ticker-item { display: inline-flex; align-items: center; gap: 8px; }
    .ticker-dot  { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

    /* ── Pause overlay ── */
    .paused-banner {
      position: absolute;
      top: 12px; right: 16px;
      background: #1c1c1c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--muted);
      display: none;
    }
    .paused-banner.show { display: block; }
  </style>
</head>
<body>

<header>
  <span class="logo">🐾</span>
  <div>
    <div class="header-title">ClawBot Inventory</div>
    <div class="header-sub">Live · MongoDB Atlas</div>
  </div>

  <div class="header-stats">
    <div class="hstat">
      <div class="val" id="h-total" style="color:var(--blue)">—</div>
      <div class="lbl">Total Items</div>
    </div>
    <div class="hstat">
      <div class="val" id="h-low" style="color:var(--yellow)">—</div>
      <div class="lbl">Low Stock</div>
    </div>
    <div class="hstat">
      <div class="val" id="h-out" style="color:var(--red)">—</div>
      <div class="lbl">Out of Stock</div>
    </div>
    <div class="hstat">
      <div class="val" id="h-value" style="color:var(--green)">—</div>
      <div class="lbl">Inventory Value</div>
    </div>
  </div>

  <div class="mongo-pill">
    <div class="pulse-dot"></div>
    Live
  </div>
  <a href="/scanner" style="
    margin-left:12px;
    padding:7px 13px;
    background:transparent;
    border:1px solid #272727;
    border-radius:8px;
    color:#555;
    font-size:12px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:all 0.15s;
  " onmouseover="this.style.borderColor='#4ade80';this.style.color='#4ade80'"
     onmouseout="this.style.borderColor='#272727';this.style.color='#555'">← Scanner</a>
</header>

<div class="scroll-outer" id="scroll-outer">
  <div class="scroll-inner" id="scroll-inner">
    <!-- rows injected here -->
  </div>
  <div class="paused-banner" id="paused-banner">⏸ Paused</div>
</div>

<div class="ticker">
  <div class="ticker-track" id="ticker-track"><!-- injected --></div>
</div>

<script>
  const BASE = window.location.origin;
  const H = { 'ngrok-skip-browser-warning': 'true' };

  let items = [];
  let scrollY = 0;
  let paused = false;
  let lastData = {};
  let animFrame;

  // ── Auto-scroll ──
  const outer = document.getElementById('scroll-outer');
  const inner = document.getElementById('scroll-inner');

  function startScroll() {
    const speed = 0.6; // px per frame
    function step() {
      if (!paused) {
        scrollY += speed;
        const maxScroll = inner.scrollHeight - outer.clientHeight;
        if (maxScroll > 0 && scrollY >= maxScroll) scrollY = 0;
        inner.style.transform = `translateY(-${scrollY}px)`;
      }
      animFrame = requestAnimationFrame(step);
    }
    animFrame = requestAnimationFrame(step);
  }

  // Pause on hover/touch
  outer.addEventListener('mouseenter', () => { paused = true; document.getElementById('paused-banner').classList.add('show'); });
  outer.addEventListener('mouseleave', () => { paused = false; document.getElementById('paused-banner').classList.remove('show'); });
  outer.addEventListener('touchstart', () => { paused = !paused; document.getElementById('paused-banner').classList.toggle('show', paused); });

  // ── Render ──
  function stockColor(qty, reorder) {
    if (qty === 0)       return 'var(--red)';
    if (qty <= reorder)  return 'var(--yellow)';
    return 'var(--green)';
  }

  function rowClass(qty, reorder) {
    if (qty === 0)       return 'item-row out';
    if (qty <= reorder)  return 'item-row low';
    return 'item-row';
  }

  function statusBadge(qty, reorder) {
    if (qty === 0)       return `<span class="status-badge out">⚠ Out of Stock</span>`;
    if (qty <= reorder)  return `<span class="status-badge low">↓ Low Stock</span>`;
    return `<span class="status-badge ok">✓ In Stock</span>`;
  }

  function renderRows(data) {
    inner.innerHTML = data.map(d => {
      const color = stockColor(d.quantity, d.reorder_point);
      const maxQty = Math.max(d.reorder_point * 3, d.quantity, 1);
      const pct = Math.min(100, (d.quantity / maxQty) * 100);
      const imgSrc = d.image_url || '';
      return `<div class="item-row ${rowClass(d.quantity, d.reorder_point).replace('item-row ', '')}" id="row-${d.id}">
        <img class="item-img" src="${imgSrc}" onerror="this.src=''" alt="" />
        <div>
          <div class="item-name">${esc(d.name)}</div>
          <div class="item-meta">${esc(d.brand ?? '')}${d.brand && d.category ? ' · ' : ''}${esc(d.category ?? '')}</div>
          <div class="item-barcode">${esc(d.id)}</div>
        </div>
        <div class="cat-badge">${esc(d.category ?? '—')}</div>
        <div class="stock-col">
          <div class="stock-nums">
            <span class="stock-qty" style="color:${color}">${d.quantity}</span>
            <span class="stock-of">/ reorder at ${d.reorder_point}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>
        ${statusBadge(d.quantity, d.reorder_point)}
        <div class="price-col">
          <div class="price-val">${d.sell_price != null ? '$' + Number(d.sell_price).toFixed(2) : '—'}</div>
          <div class="price-cost">${d.cost_price != null ? 'Cost $' + Number(d.cost_price).toFixed(2) : ''}</div>
        </div>
      </div>`;
    }).join('');
  }

  function updateStats(data) {
    const low   = data.filter(d => d.quantity > 0 && d.quantity <= d.reorder_point).length;
    const out   = data.filter(d => d.quantity === 0).length;
    const value = data.reduce((s, d) => s + (d.quantity * (d.cost_price ?? 0)), 0);
    document.getElementById('h-total').textContent = data.length;
    document.getElementById('h-low').textContent   = low;
    document.getElementById('h-out').textContent   = out;
    document.getElementById('h-value').textContent = '$' + value.toFixed(0);
  }

  function updateTicker(data) {
    const doubled = [...data, ...data];
    const track = doubled.map(d => {
      const color = stockColor(d.quantity, d.reorder_point);
      return `<span class="ticker-item">
        <span class="ticker-dot" style="background:${color}"></span>
        <strong>${esc(d.name)}</strong> · ${d.quantity} in stock
      </span>`;
    }).join('');
    document.getElementById('ticker-track').innerHTML = track;
  }

  function flashUpdated(newData) {
    newData.forEach(d => {
      const prev = lastData[d.id];
      if (prev && prev.quantity !== d.quantity) {
        const row = document.getElementById('row-' + d.id);
        if (row) {
          row.classList.remove('flash');
          void row.offsetWidth;
          row.classList.add('flash');
        }
      }
      lastData[d.id] = d;
    });
  }

  const esc = s => String(s ?? '').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // ── Fetch & refresh ──
  async function refresh() {
    try {
      const res = await fetch(BASE + '/db/inventory', { headers: H });
      const data = await res.json();
      // Sort: out of stock first, then low stock, then by name
      data.sort((a, b) => {
        const scoreA = a.quantity === 0 ? 0 : a.quantity <= a.reorder_point ? 1 : 2;
        const scoreB = b.quantity === 0 ? 0 : b.quantity <= b.reorder_point ? 1 : 2;
        if (scoreA !== scoreB) return scoreA - scoreB;
        return a.name.localeCompare(b.name);
      });

      if (inner.children.length === 0) {
        // First load
        renderRows(data);
        data.forEach(d => { lastData[d.id] = d; });
        updateTicker(data);
        startScroll();
      } else {
        flashUpdated(data);
        // Re-render without resetting scroll
        const savedScroll = scrollY;
        renderRows(data);
        scrollY = savedScroll;
        updateTicker(data);
      }
      updateStats(data);
    } catch(e) {
      console.error(e);
    }
  }

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
